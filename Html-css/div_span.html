<!DOCTYPE html>
<html>
<head>
    <title>Divs e Spans</title>
<meta charset="UTF-8">

<style type="text/css">
    #topo {
        background: gray;
    }

    #conteudo {
        background: red;
    }

    .produto {
        background: green;
        margin: 10px;
    }
</style>

</head>
<body>
    <div id="topo">
        <img src="imagens/floresta.png" width="200">
        <ul>
            <li>Home</li>
            <li>Produtos</li>
            <li>Contato</li>
        </ul>
    </div>

    <div id="conteudo">
        <div class="produto">Produto 1</div> 
        <div class="produto">Produto 2</div> 
        <div class="produto">Produto 3</div>
    </div>
</body>
